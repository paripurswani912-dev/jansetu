<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>JanSetu — Audit Log</title>
<style>
  body { font-family: system-ui, sans-serif; background:#f4f6f8; margin:0; }
  .wrap { padding:24px; }
  .card { background:#fff; border-radius:10px; padding:16px 18px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .row { font-size:12px; font-family:monospace; padding:6px 0; border-bottom:1px solid #eee; }
  .ok { color:#1a7f37; font-weight:600; }
  .bad { color:#b42318; font-weight:600; }
  button { padding:8px 14px; border-radius:6px; border:1px solid #ccc; background:#fff; cursor:pointer; }
</style></head>
<body>
<script src="/static/nav.js"></script>
<div class="wrap">
  <div class="card">
    <h3>Chain integrity <button onclick="verify()">Verify chain</button></h3>
    <div id="verify"></div>
  </div>
  <div class="card"><h3>Audit trail</h3><div id="rows"></div></div>
</div>
<script>
renderNav('audit'); renderFooter();
const user = JSON.parse(localStorage.getItem('jansetu_user') || 'null');
if (!user || user.role === 'citizen') location.href = '/static/login.html';

async function verify() {
  const v = await (await fetch(`/api/audit/verify?user_id=${user.user_id}`)).json();
  document.getElementById('verify').innerHTML = v.valid
    ? `<span class="ok">VALID — ${v.checked} rows checked, chain intact</span>`
    : `<span class="bad">BROKEN at row ${v.broken_at} — ${v.reason}</span>`;
}
(async () => {
  const rows = await (await fetch(`/api/audit?user_id=${user.user_id}`)).json();
  document.getElementById('rows').innerHTML = rows.map(r =>
    `<div class="row">${r.ts} | ${r.actor} | ${r.action} | ${r.entity} | ${r.detail} | hash:${(r.hash||'').slice(0,10)}…</div>`).join('');
  verify();
})();
</script>
</body></html>
