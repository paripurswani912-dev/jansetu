<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>SetuCare — Exceptions</title>
<style>
  body { font-family: system-ui, sans-serif; background:#f4f6f8; margin:0; }
  .wrap { padding:24px; }
  .card { background:#fff; border-radius:10px; padding:16px 18px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid #eee; }
  .OPEN { color:#b42318; font-weight:600; }
</style>
</head>
<body>
<script src="/static/nav.js"></script>
<div class="wrap">
  <div class="card"><h3>Open exceptions</h3><table id="exc"></table></div>
  <div class="card"><h3>Dead letters (failed connector calls)</h3><table id="dl"></table></div>
</div>
<script>
renderNav('exceptions'); renderFooter();
const user = JSON.parse(localStorage.getItem('jansetu_user') || 'null');
if (!user || user.role === 'citizen') location.href = '/static/login.html';

(async () => {
  const exc = await (await fetch(`/api/exceptions?user_id=${user.user_id}`)).json();
  document.getElementById('exc').innerHTML = exc.length
    ? exc.map(e => `<tr><td>${e.type}</td><td>${e.application_id||''}</td><td>${e.detail}</td><td class="${e.status}">${e.status}</td></tr>`).join('')
    : '<tr><td>No open exceptions</td></tr>';

  const dl = await (await fetch(`/api/dead-letter?user_id=${user.user_id}`)).json();
  document.getElementById('dl').innerHTML = dl.length
    ? dl.map(d => `<tr><td>${d.system}</td><td>${d.external_id}</td><td>${d.attempts} attempts</td><td>${d.error}</td></tr>`).join('')
    : '<tr><td>None</td></tr>';
})();
</script>
</body>
</html>
