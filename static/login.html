<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>SetuCare — Login</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f4f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 340px;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 4px;
        }

        p {
            color: #666;
            font-size: 13px;
            margin: 0 0 16px;
        }

        select,
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            background: #1a56db;
            color: #fff;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>SetuCare</h1>
        <p>Mock SSO — pick a user. (Real deployment: OIDC / federated identity.)</p>
        <select id="userSelect"></select>
        <button onclick="login()">Continue</button>
    </div>
    <script>
        async function init() {
            const users = await (await fetch('/api/users')).json();
            document.getElementById('userSelect').innerHTML =
                users.map(u => `<option value="${u.user_id}">${u.label}</option>`).join('');
        }
        async function login() {
            const userId = document.getElementById('userSelect').value;
            const me = await (await fetch(`/api/me?user_id=${userId}`)).json();
            localStorage.setItem('jansetu_user', JSON.stringify(me));
            window.location.href = (me.role === 'citizen') ? '/static/citizen.html' : '/static/dashboard.html';
        }
        init();
    </script>
</body>

</html>
